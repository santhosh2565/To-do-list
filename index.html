<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>
<body class="vh-100 d-flex justify-content-center align-items-start pt-5">

    <div class="card todo-card border-0 mx-3">
        <div class="card-body p-4">
            <h2 class="card-title text-center mb-4 fw-bold text-primary">Task Manager</h2>
            
            <div class="input-group mb-4">
                <input type="text" id="taskInput" class="form-control form-control-lg" placeholder="What needs to be done?" aria-label="New task">
                <button class="btn btn-primary px-4" type="button" id="addButton">
                    <i class="bi bi-plus-lg"></i> Add
                </button>
            </div>

            <div id="emptyState" class="text-center py-4 text-muted">
                <i class="bi bi-clipboard-check display-4 d-block mb-3 text-light"></i>
                <p class="mb-0">All caught up! Add a task to get started.</p>
            </div>

            <ul id="taskList" class="list-group list-group-flush">
                </ul>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
